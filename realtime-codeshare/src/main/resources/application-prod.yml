# Production profile. Activate with: --spring.profiles.active=prod
# Assumes TLS is terminated at a reverse proxy / load balancer that forwards
# X-Forwarded-*; this profile enables RemoteIpValve (native strategy) to trust them
# only from TRUSTED_PROXIES. The base profile trusts no forwarded headers.
#
# Required environment (the startup check in StartupConfig fails fast if missing):
#   CODESHARE_ALLOWED_ORIGINS   exact prod origin(s), e.g. https://codeshare.example.com
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GITHUB_REDIRECT_URI   (only if GitHub push is enabled)
server:
  # Trust X-Forwarded-* only from the load balancer / proxy. RemoteIpValve (native
  # strategy) honors XFF and X-Forwarded-Proto exclusively from internal-proxies, so
  # a client can't spoof its IP (rate-limit bypass) or scheme. Override TRUSTED_PROXIES
  # with your LB's CIDR; the default trusts private ranges + loopback. The proxy MUST
  # overwrite (not append) X-Forwarded-For.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}'
  servlet:
    session:
      cookie:
        secure: true          # cookies only over HTTPS
        same-site: lax
        http-only: true

codeshare:
  # No localhost fallback in prod — must be set explicitly to the real origin(s).
  # Empty default so the startup check (ProdEnvCheck) reports a clear message.
  allowed-origins: ${CODESHARE_ALLOWED_ORIGINS:}

# Bind actuator to a separate internal port so health/metrics aren't exposed on the
# public listener. Point your orchestrator's probes and Prometheus scraper at it.
management:
  server:
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: INFO
    com.collabcode.realtime_codeshare: INFO
