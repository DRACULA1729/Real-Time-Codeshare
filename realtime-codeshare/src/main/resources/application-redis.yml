# Shared/live document cache in Redis (Upstash-compatible). Activate with the
# `redis` profile. Re-enables Redis; keeps DataSource/JPA/Flyway excluded.
#
# Upstash: set REDIS_URL to the TLS endpoint, e.g.
#   rediss://default:<token>@<host>:6379
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5s
      lettuce:
        shutdown-timeout: 1s
