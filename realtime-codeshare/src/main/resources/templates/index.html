<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collab CodeShare (OT)</title>

    <!-- Vendored locally: no external domains, works fully offline -->
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
    <link rel="stylesheet" href="vendor/codemirror/theme/dracula.min.css">
    <link rel="stylesheet" href="vendor/highlightjs/default.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ Gate: create or join, then waiting room ============ -->
<div id="gate">
    <div class="gate-card">
        <h1>Collab CodeShare</h1>

        <div id="createPanel" class="gate-panel" hidden>
            <p class="gate-sub">Start a new collaborative session.</p>
            <label>Your name <input id="createName" placeholder="Ghost" maxlength="40"></label>
            <label>Cursor color <input id="createColor" type="color" value="#7aa2f7"></label>
            <button id="createBtn" class="primary">Create session</button>
        </div>

        <div id="joinPanel" class="gate-panel" hidden>
            <p class="gate-sub">Joining session <code id="joinSessionId"></code>. The host must admit you.</p>
            <label>Your name <input id="joinName" placeholder="Ghost" maxlength="40"></label>
            <label>Cursor color <input id="joinColor" type="color" value="#bb9af7"></label>
            <button id="joinBtn" class="primary">Ask to join</button>
        </div>

        <div id="waitingPanel" class="gate-panel" hidden>
            <div class="spinner"></div>
            <p>Waiting for the host to let you in…</p>
        </div>

        <div id="deniedPanel" class="gate-panel" hidden>
            <p id="deniedMsg" class="error">Your request was declined.</p>
        </div>
    </div>
</div>

<!-- ============ App: editor, presence, admit panel, actions ============ -->
<div id="app" hidden>
    <div id="topbar">
        <h1>Collab CodeShare <span class="muted">(OT)</span></h1>
        <div id="sessionInfo"></div>
        <button id="copyLinkBtn" class="ghost" title="Copy invite link">Copy invite link</button>
        <span id="copyLinkStatus" class="muted"></span>
    </div>

    <div id="lang-label">Detected: <span id="lang-name">plaintext</span></div>

    <textarea id="editor"># Write your code here...</textarea>

    <div class="side">
        <div class="user-list" id="userStatus">
            <strong>Users online</strong>
            <div id="usersOnlineList"></div>
        </div>

        <div id="joinRequestsPanel" hidden>
            <strong>Join requests</strong>
            <div id="joinRequestsList"></div>
        </div>
    </div>

    <div class="action-buttons-collapsible">
        <button id="toggleActionsBtn" title="Toggle Actions">☰ Actions</button>
        <div class="action-buttons-content">
            <div class="row">
                <input id="filenameInput" placeholder="filename" />
                <button id="downloadMainBtn">Download</button>
                <button id="downloadMenuBtn">▾</button>
                <div id="downloadMenu" hidden>
                    <div class="download-option" data-mode="raw">Download as <span id="download-ext-display"></span></div>
                    <div class="download-option" data-mode="zip">Download as .zip (with metadata)</div>
                </div>
            </div>

            <fieldset id="githubSection" hidden>
                <legend>GitHub</legend>
                <button id="githubAuthBtn" hidden>Authorize GitHub</button>
                <button id="githubDisconnectBtn" class="ghost" hidden>Disconnect</button>
                <div id="githubForm" hidden>
                    <div class="row"><input id="ghOwner" placeholder="owner"><input id="ghRepo" placeholder="repo"></div>
                    <div class="row"><input id="ghPath" placeholder="path e.g. src/Main.java"><input id="ghBranch" placeholder="branch (optional)"></div>
                    <div class="row"><input id="ghMessage" placeholder="commit message (optional)"></div>
                    <button id="githubPushBtn">Push to GitHub</button>
                </div>
                <span id="githubStatus" class="muted"></span>
            </fieldset>
        </div>
    </div>
</div>

<!-- Vendored scripts. Order matters: core, then meta, then base modes before htmlmixed. -->
<script src="vendor/jszip/jszip.min.js"></script>
<script src="vendor/highlightjs/highlight.min.js"></script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/meta.min.js"></script>
<script src="vendor/codemirror/mode/xml.min.js"></script>
<script src="vendor/codemirror/mode/javascript.min.js"></script>
<script src="vendor/codemirror/mode/css.min.js"></script>
<script src="vendor/codemirror/mode/htmlmixed.min.js"></script>
<script src="vendor/codemirror/mode/clike.min.js"></script>
<script src="vendor/codemirror/mode/python.min.js"></script>
<script src="vendor/codemirror/mode/sql.min.js"></script>
<script src="/js/codeshare.js"></script>
</body>
</html>
