name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: realtime-codeshare

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The frontend-maven-plugin downloads Node and runs the Vite build during
      # `verify`, so this single command builds the SPA, compiles, and runs the
      # Java + TS test suites.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-codeshare-jar
          path: realtime-codeshare/target/realtime-codeshare-*.jar
          if-no-files-found: error

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      # Build the image to prove the multi-stage Dockerfile stays healthy (not pushed).
      - name: Build Docker image
        run: docker build -t realtime-codeshare:ci .
