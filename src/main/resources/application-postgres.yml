# Durable document snapshots in PostgreSQL (Neon-compatible). Activate with the
# `postgres` profile. Re-enables DataSource/JPA/Flyway; keeps Redis excluded.
#
# Neon: set DB_URL to the Neon connection string with sslmode, e.g.
#   jdbc:postgresql://<host>/<db>?sslmode=require
# and use the direct (non-pooler) or session-pooler endpoint so Flyway can run.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codeshare}
    username: ${DB_USER:codeshare}
    password: ${DB_PASSWORD:codeshare}
  jpa:
    hibernate:
      ddl-auto: none      # schema is owned by Flyway
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
