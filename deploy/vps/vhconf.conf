docRoot                   $VH_ROOT/html/
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
  rollingSize             10M
  keepDays                7
  compressArchive         1
}

extprocessor codeshare {
  type                    proxy
  address                 127.0.0.1:8080
  maxConns                200
  respBuffer              0
}

context /.well-known/acme-challenge/ {
  location                $VH_ROOT/html/.well-known/acme-challenge/
  allowBrowse             1
}

context / {
  type                    proxy
  handler                 codeshare
  addDefaultCharset       off
}

websocket /ws/ {
  address                 127.0.0.1:8080
}

rewrite  {
  enable                  1
  logLevel                0
RewriteCond %{SERVER_PORT} 80
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/sushant-codeshare.duckdns.org/privkey.pem
  certFile                /etc/letsencrypt/live/sushant-codeshare.duckdns.org/fullchain.pem
  certChain               1
}
